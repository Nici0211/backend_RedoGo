name: CI

# Wann läuft die Pipeline?
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Alte Läufe desselben Branches abbrechen (spart Zeit)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Job 1: Build + Tests auf Linux UND Windows ----------
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false              # Windows-Lauf nicht abbrechen, wenn Linux scheitert
      matrix:
        os: [ubuntu-latest, windows-latest]

    # Einheitliche Shell (bash) auf beiden Systemen: gleiche Befehle überall
    defaults:
      run:
        shell: bash

    steps:
      - name: Betriebssystem erkennen
        id: os-check
        run: |
          case "$(uname -s)" in
            Linux*)               echo "os=Linux" >> "$GITHUB_OUTPUT" ;;
            MINGW*|MSYS*|CYGWIN*) echo "os=Windows" >> "$GITHUB_OUTPUT" ;;
            *)                    echo "os=$RUNNER_OS" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java einrichten (mit Maven-Cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'        # muss zu <java.version> in der pom.xml passen
          cache: maven

      # Linux: voller Build inkl. Integrationstests (Testcontainers funktioniert)
      - name: Build + alle Tests (Linux)
        if: steps.os-check.outputs.os == 'Linux'
        run: mvn -B verify

      # Windows-Runner können keine Linux-Container starten -> kein Testcontainers.
      # Hier nur kompilieren + Unit-Tests, damit Windows-spezifische Probleme
      # (Pfade, Zeilenenden, Groß-/Kleinschreibung) auffallen.
      - name: Build + Unit-Tests (Windows)
        if: steps.os-check.outputs.os == 'Windows'
        run: mvn -B test

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}     # eindeutiger Name pro OS
          path: target/surefire-reports

      - name: JAR hochladen (nur Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ---------- Job 2: Docker-Image (nur Linux, nur auf main) ----------
  # Voraussetzung: ein Dockerfile im Projektroot. Sonst Job löschen.
  docker:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
